# Pin the target architecture to x64.
#
# `nimble` and a direct `nim c` do not always pick the same Nim installation,
# and when they disagree the build dies on a pointer-size assertion in
# nimbase.h — which reads like a broken cross-compile and is really just PATH.
# Pinning the target makes the build independent of which one wins.
#
# This applies to builds *in this repository* only; nimble installs `src/` and
# not this file, so it does not reach anyone depending on the package. On an
# ARM64 host, drop this line and make sure nimble and nim agree instead.
--cpu:amd64
